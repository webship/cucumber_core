name: Cucumber Dashboards
description: A recipe to manage the default and admin dashboards.
type: Testing
install:
  # The module that ships the dashboards. Applied after the cucumber-views
  # recipe, so the views whose blocks the dashboards place already exist.
  - display_builder
  - webdashboard
  - cucumber_core
config:
  # Only create what a site does not have yet. Re-applying this recipe on a
  # site that already has this configuration is a no-op.
  strict: false
  import:
    # A recipe installs modules with the configuration installer in syncing
    # mode, which creates simple configuration but no configuration entities
    # (see \Drupal\Core\Recipe\RecipeRunner::installModules()). Import the
    # Display Builder profile and the dashboards here, so the permissions
    # below have something to grant.
    display_builder:
      - display_builder.profile.default
      - filter.format.display_builder_html
    cucumber_core:
      - webdashboard.webdashboard.default_dashboard
      - webdashboard.webdashboard.admin_dashboard
  actions:
    user.role.admin:
      # The Cucumber distribution ships an "admin" role. On a plain Drupal
      # site that role does not exist yet, so create it before granting
      # anything to it.
      createIfNotExists:
        label: Admin
        is_admin: false
      grantPermissions:
        - 'can view default_dashboard webdashboard'
        - 'can view admin_dashboard webdashboard'
