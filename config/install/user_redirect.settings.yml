login:
  authenticated:
    redirect_url: /webdashboard/default_dashboard
  admin:
    redirect_url: /webdashboard/admin_dashboard
  super_admin:
    redirect_url: /webdashboard/admin_dashboard
logout:
  authenticated:
    redirect_url: /user/login
  admin:
    redirect_url: /user/login
  super_admin:
    redirect_url: /user/login
ignore:
  - '/user/reset/*'
ignore_for:
  login: login
  logout: 0
